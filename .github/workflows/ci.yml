# Автопроверка: при каждом push и pull request GitHub сам собирает проект
# на Linux (GCC) и Windows (Visual Studio) и запускает все тесты.
# Если что-то сломалось — в pull request появится красный крестик.
name: build-and-test

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
